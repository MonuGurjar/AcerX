[package]
name = "acer-x"
version = "0.1.0"
description = "AcerX - Modern Linux Acer Laptop Management"
authors = ["AcerX Team"]
edition = "2021"

[lib]
name = "void_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
regex = "1.10"
