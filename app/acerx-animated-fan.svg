<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#10252a"/>
    <stop offset=".72" stop-color="#071317"/>
    <stop offset="1" stop-color="#020708"/>
  </radialGradient>

  <linearGradient id="blade" x1="190" y1="110" x2="330" y2="360" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#31545a"/>
    <stop offset=".35" stop-color="#10272c"/>
    <stop offset=".72" stop-color="#061216"/>
    <stop offset="1" stop-color="#1c444a"/>
  </linearGradient>

  <linearGradient id="edge" x1="120" y1="90" x2="390" y2="410" gradientUnits="userSpaceOnUse">
    <stop stop-color="#5cf6ef"/>
    <stop offset=".45" stop-color="#12bec7"/>
    <stop offset="1" stop-color="#0b5662"/>
  </linearGradient>

  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2"/>
  </filter>

  <!-- One aerodynamic blade -->
  <path id="bladeShape" d="
    M256 247
    C273 204 291 158 347 137
    C382 124 408 129 416 145
    C426 165 400 204 370 230
    C337 258 303 272 267 273
    C258 270 253 261 256 247 Z"/>
</defs>

<!-- static housing -->
<circle cx="256" cy="256" r="238" fill="url(#bg)"/>
<circle cx="256" cy="256" r="224" stroke="#0d3940" stroke-width="4"/>
<circle cx="256" cy="256" r="211" stroke="#10343b" stroke-width="10"/>
<circle cx="256" cy="256" r="198" stroke="#061014" stroke-width="8"/>
<circle cx="256" cy="256" r="188" stroke="url(#edge)" stroke-opacity=".75" stroke-width="3"/>

<!-- segmented cyan outer ring -->
<g stroke="#31e5e5" stroke-width="13" stroke-linecap="round" filter="url(#glow)">
  <path d="M300 37 A222 222 0 0 1 378 75"/>
  <path d="M443 130 A222 222 0 0 1 470 192"/>
  <path d="M463 304 A222 222 0 0 1 432 371"/>
  <path d="M369 442 A222 222 0 0 1 299 474"/>
  <path d="M212 473 A222 222 0 0 1 146 444"/>
  <path d="M77 380 A222 222 0 0 1 42 311"/>
  <path d="M43 205 A222 222 0 0 1 73 137"/>
</g>

<!-- small accent marks -->
<g stroke="#47f7f0" stroke-width="4" stroke-linecap="round" opacity=".9">
  <path d="M108 93l10 10"/><path d="M404 93l-10 10"/>
  <path d="M92 404l10-10"/><path d="M420 404l-10-10"/>
</g>

<!-- rotating blades only -->
<g id="fan-blades">
  <animateTransform attributeName="transform" type="rotate"
    from="0 256 256" to="360 256 256" dur="1.2s" repeatCount="indefinite"/>

  <g fill="url(#blade)" stroke="#23454b" stroke-width="3">
    <use href="#bladeShape"/>
    <use href="#bladeShape" transform="rotate(72 256 256)"/>
    <use href="#bladeShape" transform="rotate(144 256 256)"/>
    <use href="#bladeShape" transform="rotate(216 256 256)"/>
    <use href="#bladeShape" transform="rotate(288 256 256)"/>
  </g>

  <!-- cyan blade edge highlights -->
  <g fill="none" stroke="#18d7d7" stroke-width="4" opacity=".45" filter="url(#soft)">
    <path d="M270 247 C292 196 312 165 351 149"/>
    <path d="M270 247 C292 196 312 165 351 149" transform="rotate(72 256 256)"/>
    <path d="M270 247 C292 196 312 165 351 149" transform="rotate(144 256 256)"/>
    <path d="M270 247 C292 196 312 165 351 149" transform="rotate(216 256 256)"/>
    <path d="M270 247 C292 196 312 165 351 149" transform="rotate(288 256 256)"/>
  </g>
</g>

<!-- static center hub -->
<circle cx="256" cy="256" r="64" fill="#050e11" stroke="#16363c" stroke-width="7"/>
<circle cx="256" cy="256" r="54" fill="#08171b" stroke="url(#edge)" stroke-width="3" filter="url(#glow)"/>
<circle cx="256" cy="256" r="38" fill="#071116" stroke="#123139" stroke-width="2"/>
<path d="M256 236l17 10v20l-17 10-17-10v-20z" fill="none" stroke="#35eeee" stroke-width="4" filter="url(#glow)"/>
<circle cx="256" cy="256" r="4" fill="#51ffff"/>

<!-- inner ring -->
<circle cx="256" cy="256" r="178" stroke="#1ad9d8" stroke-opacity=".55" stroke-width="3"/>
</svg>